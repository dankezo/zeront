name: Update radar feed

on:
  schedule:
    - cron: "17 1 * * *"   # daily, 01:17 UTC (08:17 Vietnam)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild feed from CISA KEV + aggregates
        run: python3 tools/build_feed.py
      - name: Commit if changed
        run: |
          git config user.name "zeront-bot"
          git config user.email "zeront-bot@users.noreply.github.com"
          git add feed.json feed.xml data.js
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "feed: daily radar update"
            git push
          fi
